# Which branch, which Nexus file, and how each release line is presented.
#
# Committed on purpose: none of this is secret. The ids are public (they are visible in the
# page's own API info), and having them here is what lets bin/release.sh run without anyone
# re-deriving them from the Nexus page each time - which is where the hand-editing crept in.
# The API key is not here; it stays in ~/.config/nexus-upload.env like every other credential.
#
# Sourced by bin/release.sh, which reads the block for the line it was asked for.

# The Nexus mod page. One page carries both lines; this is the API's id for it, not the
# number in the page URL (that one is game-scoped and different).
NEXUS_MOD_ID="4548370376889"

# --- 3.x line ---------------------------------------------------------------------------
v3_PROFILE="v3"
v3_REF="main"
# A file, not a new upload each time: Nexus moves the previous *version of the same file* to
# Old files by itself. Uploading a fresh file entry instead leaves both on the page, side by
# side, which is exactly what happened to the v2.6 line in August 2026 and had to be tidied up
# by hand afterwards.
v3_NEXUS_FILE_ID="7599716"
v3_NEXUS_CATEGORY="main"
v3_GAME_LABEL="V3.1"
# The page's headline version follows the current line only.
v3_UPDATE_MOD_VERSION="true"
v3_RELEASE_HEADER="For 7 Days to Die 3.x (verified on 3.1.0). Players on 7 Days to Die v2.6 should use the %OTHER_VERSION% release instead."

# --- v2.6 line --------------------------------------------------------------------------
v26_PROFILE="v26"
v26_REF="v26-work"
v26_NEXUS_FILE_ID="7403906"
# optional, not main: that is how the file is categorised on the page, and the default would
# silently re-categorise it.
v26_NEXUS_CATEGORY="optional"
v26_GAME_LABEL="V2.6"
v26_UPDATE_MOD_VERSION="false"
v26_RELEASE_HEADER="For 7 Days to Die v2.6 (and modpacks built on it, such as The Wasteland). Players on 7 Days to Die 3.x should use the %OTHER_VERSION% release instead."

# Shared closing paragraph for the GitHub release notes. What it claims is exactly what
# bin/run-release-verification.sh checks, so if the stages change, change this too.
RELEASE_FOOTER="Checked against this exact ZIP on a running game rather than against a test build: the trader dialog in each language, a real trip chosen from the dialog, a hired companion coming along while a placed turret stays put, a 1000m trip that has to prepare its destination first, a destination list long enough to need two pages, and a trip with the optional travel cost switched on."
